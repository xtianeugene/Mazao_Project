<!-- templates/mpesa/stk_form.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Make Payment - M-Pesa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #006400;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #004d00;
        }
        .alert {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Make M-Pesa Payment</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'mpesa:initiate_payment' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="phone_number">Phone Number:</label>
            <input type="text"
                   id="phone_number"
                   name="phone_number"
                   placeholder="07XXXXXXXX or 2547XXXXXXXX"
                   required>
            <small>Format: 0712345678 or 254712345678</small>
        </div>

        <div class="form-group">
            <label for="amount">Amount (KES):</label>
            <input type="number"
                   id="amount"
                   name="amount"
                   min="1"
                   step="1"
                   required>
        </div>

        <div class="form-group">
            <label for="account_reference">Reference:</label>
            <input type="text"
                   id="account_reference"
                   name="account_reference"
                   value="PAYMENT"
                   placeholder="Payment reference">
        </div>

        <div class="form-group">
            <label for="transaction_desc">Description:</label>
            <input type="text"
                   id="transaction_desc"
                   name="transaction_desc"
                   value="Payment for services"
                   placeholder="Transaction description">
        </div>

        <button type="submit">Make Payment</button>

        <div style="margin-top: 20px;">
            <a href="{% url 'mpesa:index' %}">Back to Home</a>
        </div>
    </form>
</body>
</html>
