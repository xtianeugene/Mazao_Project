{% extends 'base.html' %}

{% block title %}Login - Mazao{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0"><i class="fas fa-sign-in-alt"></i> Login to Your Account</h4>
                </div>
                <div class="card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}

                        <!-- Display all form errors -->
                        {% if form.errors %}
                        <div class="alert alert-danger">
                            <h5>Login Error</h5>
                            <p>Please check your email and password.</p>
                        </div>
                        {% endif %}

                        <!-- Email Field (must be named "username" for AuthenticationForm) -->
                        <div class="mb-3">
                            <label for="id_username" class="form-label">Email Address</label>
                            <input type="email"
                                   name="username"
                                   id="id_username"
                                   class="form-control"
                                   placeholder="Enter your email"
                                   required
                                   autofocus>
                        </div>

                        <!-- Password Field -->
                        <div class="mb-3">
                            <label for="id_password" class="form-label">Password</label>
                            <input type="password"
                                   name="password"
                                   id="id_password"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   required>
                        </div>

                        <!-- Remember Me -->
                        <div class="mb-3 form-check">
                            <input type="checkbox"
                                   name="remember_me"
                                   id="id_remember_me"
                                   class="form-check-input">
                            <label class="form-check-label" for="id_remember_me">
                                Remember me
                            </label>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-sign-in-alt"></i> Login
                            </button>
                        </div>
                    </form>

                    <hr>

                    <div class="text-center">
                        <p class="mb-2">Don't have an account?</p>
                        <a href="{% url 'register' %}" class="btn btn-outline-success">
                            <i class="fas fa-user-plus"></i> Create New Account
                        </a>
                        <p class="mt-3">
                            <a href="{% url 'password_reset' %}" class="text-decoration-none">Forgot your password?</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
