{% extends 'base.html' %}

{% block title %}Password Reset Complete - Mazao{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0 text-center">
                        <i class="fas fa-check-circle"></i> Password Reset Complete
                    </h4>
                </div>
                <div class="card-body p-4 text-center">
                    <div class="mb-4">
                        <i class="fas fa-lock-open fa-4x text-success"></i>
                    </div>

                    <h5>Password Reset Successful!</h5>
                    <p class="text-muted">
                        Your password has been set. You may now log in with your new password.
                    </p>

                    <div class="mt-4">
                        <a href="{% url 'login' %}" class="btn btn-success">
                            <i class="fas fa-sign-in-alt me-2"></i> Log In Now
                        </a>
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                            <i class="fas fa-home me-2"></i> Go to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
